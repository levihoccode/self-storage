# Giá trị giả cho các test boot full context.
#
# `application.yml` cố tình KHÔNG đặt default cho secret: thiếu env thì app phải chết ngay lúc
# khởi động chứ không phải lỗi giữa chừng khi đang chạy. Nhưng điều đó khiến mọi @SpringBootTest
# cũng chết theo, kể cả test không liên quan gì tới JWT hay thanh toán.
#
# File này chỉ nằm trong test classpath nên không ảnh hưởng lúc chạy thật — fail-fast vẫn nguyên.
# Có nó thì người viết test mới không phải nhớ khai lại secret của module người khác.
#
# Test nào cần giá trị cụ thể thì override bằng @SpringBootTest(properties = ...).

security.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

vnpay.tmn-code=TESTTMN1
vnpay.hash-secret=0123456789abcdef0123456789abcdef
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payments/vnpay/return

# Giá trị giả cho module media (CloudinaryProperties @NotBlank). Test không gọi mạng —
# Cloudinary chỉ bị mock trong unit test và không được gọi từ @SpringBootTest.
cloudinary.name=test-cloud
cloudinary.key=test-key
cloudinary.secret=test-secret
# Không để job sửa state tự chạy trong test; test gọi method trực tiếp.
booking.deposit-repair.initial-delay-ms=3600000
