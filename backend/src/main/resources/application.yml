spring:
  application:
    name: self-storage
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/self_storage}
    username: ${DB_USER:self_storage}
    password: ${DB_PASSWORD:self_storage}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    vn.lemar.selfstorage: DEBUG
