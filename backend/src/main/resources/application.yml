spring:
  application:
    name: self-storage
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/self_storage}
    username: ${DB_USER:self_storage}
    password: ${DB_PASSWORD:self_storage}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

# VNPay — giá trị thật nằm trong .env của từng người, xem docs/vnpay-sandbox.md.
# Không đặt default: thiếu env thì @NotBlank cho app chết ngay lúc khởi động,
# tốt hơn là NPE giữa luồng thu tiền.
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:}
  return-url: ${VNPAY_RETURN_URL:}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    vn.lemar.selfstorage: DEBUG
