spring:
  application:
    name: self-storage
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/self_storage}
    username: ${DB_USER:self_storage}
    password: ${DB_PASSWORD:self_storage}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
app:
  mail:
    from: ${MAIL_FROM:no-reply@self-storage.vn}
  verify-base-url: ${VERIFY_BASE_URL:http://localhost:8080/api/auth/verify-email}

jwt:
  secret: ${JWT_SECRET:dev-only-please-override-this-with-a-random-256-bit-secret-in-env}
  access-token-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    vn.lemar.selfstorage: DEBUG

