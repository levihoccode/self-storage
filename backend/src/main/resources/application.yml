spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: self-storage
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/self_storage}
    username: ${DB_USER:self_storage}
    password: ${DB_PASSWORD:self_storage}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  mail:
    from: ${MAIL_FROM:noreply@lemar.vn}

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  password:
    bcrypt-strength: ${BCRYPT_STRENGTH:10}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    vn.lemar.selfstorage: DEBUG
