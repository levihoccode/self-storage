name: Backend CI

# Chạy trên MỌI PR (không lọc path ở cấp workflow) để nếu đặt required thì không bao giờ
# bị treo "đang chờ check". Khi backend/ chưa có trên nhánh (A1a chưa merge) thì bỏ qua.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Nhánh này đã có backend/ chưa?
        id: scope
        run: |
          if [ -f backend/mvnw ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "backend/ chưa có trên nhánh này — bỏ qua build."
          fi

      - name: Kiểm tra sql/ đồng bộ với migration
        if: steps.scope.outputs.run == 'true'
        working-directory: backend
        run: |
          diff -q sql/schema.sql src/main/resources/db/migration/V1__baseline_schema.sql
          diff -q sql/seed.sql src/main/resources/db/migration/V2__baseline_seed.sql
          echo "sql/ đồng bộ: OK"

      - name: Set up Java 17
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build + test + kiểm tra ranh giới module
        if: steps.scope.outputs.run == 'true'
        working-directory: backend
        run: ./mvnw -B verify

      - name: Tóm tắt coverage (JaCoCo)
        if: steps.scope.outputs.run == 'true' && !cancelled()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "backend/target/site/jacoco/jacoco.xml"
          if not os.path.exists(path):
              print("Không có jacoco.xml — build chưa tới bước report.")
              raise SystemExit(0)

          root = ET.parse(path).getroot()
          summary = ["## Backend coverage (JaCoCo)", "", "| Counter | Covered | Total | % |", "|---|---|---|---|"]
          for counter in root.findall("counter"):
              covered, missed = int(counter.get("covered")), int(counter.get("missed"))
              total = covered + missed
              pct = f"{covered / total * 100:.1f}%" if total else "n/a"
              print(f"{counter.get('type'):12} {pct:>7}  ({covered}/{total})")
              summary.append(f"| {counter.get('type')} | {covered} | {total} | {pct} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")
          PY

      - name: Set up Python (cho diff-cover)
        if: steps.scope.outputs.run == 'true' && github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cổng coverage — dòng thay đổi ≥ 80% (diff-cover)
        # Bypass hợp lệ (rất hiếm): nhãn 'waiver' — ví dụ PR hợp nhất code cũ chưa có test.
        # Chạy từ repo root: diff-cover cần path git (backend/...) khớp coverage report.
        if: steps.scope.outputs.run == 'true' && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'waiver')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet diff-cover
          diff-cover backend/target/site/jacoco/jacoco.xml \
            --src-roots backend/src/main/java backend/src/test/java \
            --compare-branch="$BASE_SHA" \
            --fail-under=80 \
            --format html:backend/target/site/jacoco/diff-cover.html \
            --show-uncovered

      - name: Lưu báo cáo coverage (artifact)
        if: steps.scope.outputs.run == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore
